<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090a0c">
  <title>Finn — Life Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <main id="app" class="app-content"></main>

  <nav class="bottom-nav" aria-label="Hauptnavigation">
    <button data-route="home" class="active">
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </button>

    <button data-route="day">
      <span class="nav-icon">✓</span>
      <span>Mein Tag</span>
    </button>

    <button data-route="calendar">
      <span class="nav-icon">□</span>
      <span>Kalender</span>
    </button>

    <button data-route="stats">
      <span class="nav-icon">▥</span>
      <span>Stats</span>
    </button>

    <button data-route="profile">
      <span class="nav-icon">○</span>
      <span>Profil</span>
    </button>
  </nav>
</div>

<div id="modal-root"></div>

<script src="app.js"></script>
</body>
</html>
